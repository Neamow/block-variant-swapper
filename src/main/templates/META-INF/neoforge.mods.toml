license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Neamow"
description='''
Swap block variants, such as stairs, slabs or doors, on the fly.
'''

# Common mixins (server + client)
[[mixins]]
config="${mod_id}.mixins.json"

# Client-only mixins (HUD overlay, scroll intercept)
[[mixins]]
config="${mod_id}.client.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
